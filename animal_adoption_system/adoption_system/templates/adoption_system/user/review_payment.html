{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Review Payment</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #f4f6fa;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    background: white;
    width: 450px;
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.08);
    animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
    from {opacity:0; transform: translateY(15px);}
    to {opacity:1; transform: translateY(0);}
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

.summary {
    background: #f9fafb;
    padding: 18px;
    border-radius: 12px;
    font-size: 14px;
}

.summary p {
    margin: 10px 0;
}

.total {
    font-size: 18px;
    font-weight: bold;
    color: #be123c;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 10px;
    background: #be123c;
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: #9f1239;
}
</style>
</head>

<body>

<div class="card">
    <h2>Review Payment</h2>

    <div class="summary">
        <p><strong>Payment Method:</strong> {{ payment_method }}</p>
        <p><strong>Donation:</strong> ₹ {{ donation }}</p>
        <p class="total">Total Amount: ₹ {{ total }}</p>
    </div>

    <form method="POST" action="{% url 'enter_pin' %}">
        {% csrf_token %}
        <button>Proceed to Secure Payment</button>
    </form>
</div>

</body>
</html>
