{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Processing Donation</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #fdf2f8, #f9fafb);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Card */
.processing-card {
    background: white;
    width: 440px;
    padding: 45px;
    border-radius: 22px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.08);
    text-align: center;
    animation: fadeIn 0.4s ease;
}

.icon-circle {
    width: 70px;
    height: 70px;
    margin: 0 auto 15px;
    border-radius: 50%;
    background: #fce7f3;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    color: #be123c;
}

h2 {
    margin-bottom: 8px;
}

.status-text {
    margin-top: 10px;
    font-size: 15px;
    color: #6b7280;
    min-height: 24px;
}

/* Loader Dots */
.loader {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 8px;
}

.loader span {
    width: 10px;
    height: 10px;
    background: #be123c;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out;
}

.loader span:nth-child(2) { animation-delay: 0.2s; }
.loader span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Success Style */
.success {
    color: #16a34a;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="processing-card">

    <div class="icon-circle">
        <i class="fa-solid fa-lock"></i>
    </div>

    <h2>Secure Donation Processing</h2>

    <div class="status-text" id="statusText">
        Connecting to Bank...
    </div>

    <div class="loader" id="loader">
        <span></span>
        <span></span>
        <span></span>
    </div>

</div>

<script>
    const statusText = document.getElementById("statusText");
    const loader = document.getElementById("loader");

    setTimeout(() => {
        statusText.innerText = "Verifying Transaction...";
    }, 1500);

    setTimeout(() => {
        statusText.innerText = "Transaction Approved ✅";
        statusText.classList.add("success");
        loader.style.display = "none";
    }, 3000);

    setTimeout(() => {
        window.location.href = "{% url 'donation_payment_success' %}";
    }, 4500);
</script>

</body>
</html>
