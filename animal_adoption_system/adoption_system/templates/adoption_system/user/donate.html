{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Make a Donation</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #f9fafb, #eef2ff);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Card */
.card {
    background: white;
    width: 480px;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.08);
    animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

h2 {
    text-align: center;
    margin-bottom: 10px;
    font-size: 22px;
    font-weight: 700;
}

.subtitle {
    text-align: center;
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 25px;
}

/* Form */
.form-group {
    margin-bottom: 20px;
}

label {
    font-weight: 600;
    font-size: 14px;
    display: block;
    margin-bottom: 8px;
}

input[type="number"] {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
    font-size: 14px;
    transition: 0.2s;
}

input[type="number"]:focus {
    outline: none;
    border-color: #be123c;
}

/* Radio Buttons */
.payment-options {
    display: flex;
    gap: 20px;
    margin-top: 5px;
}

.payment-option {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
}

/* Button */
button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #be123c, #9f1239);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
    opacity: 0.95;
}

/* Error */
.error {
    background: #fee2e2;
    color: #991b1b;
    padding: 8px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 15px;
}

/* Back link */
.back-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #6b7280;
    text-decoration: none;
}

.back-link:hover {
    color: #be123c;
}
</style>
</head>

<body>

<div class="card">

    <h2>❤️ Support the Shelter</h2>
    <p class="subtitle">
        Your donation helps us rescue, treat, and rehome animals in need.
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <!-- Donation Amount -->
        <div class="form-group">
            <label>Donation Amount (₹)</label>
            <input type="number"
                   name="donation_amount"
                   min="1"
                   step="0.01"
                   placeholder="Enter amount"
                   required>
        </div>

        <!-- Payment Method -->
        <div class="form-group">
            <label>Select Payment Method</label>

            <div class="payment-options">
                <div class="payment-option">
                    <input type="radio"
                           name="payment_method"
                           value="Online"
                           required>
                    <span>Online</span>
                </div>

                <div class="payment-option">
                    <input type="radio"
                           name="payment_method"
                           value="Offline"
                           required>
                    <span>Offline</span>
                </div>
            </div>
        </div>

        <button type="submit">
            Donate Now
        </button>

    </form>

    <a href="{% url 'userhome' %}" class="back-link">
        ← Back to Home
    </a>

</div>

</body>
</html>
