{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Processing...</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        body {
            margin: 0; font-family: "Poppins", sans-serif;
            background: #f4f6fa; display: flex;
            justify-content: center; align-items: center; height: 100vh;
        }

        .processing-card {
            background: white; width: 400px; padding: 50px 30px;
            border-radius: 24px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
        }

        /* Radar/Pulse Effect */
        .pulse-container {
            position: relative; width: 90px; height: 90px;
            margin: 0 auto 30px; display: flex;
            align-items: center; justify-content: center;
        }

        .icon-circle {
            width: 70px; height: 70px; background: #e0e7ff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 30px; color: #4f46e5; position: relative; z-index: 2;
            transition: all 0.5s ease;
        }

        .pulse-ring {
            position: absolute; width: 100%; height: 100%;
            border-radius: 50%; border: 3px solid #4f46e5; z-index: 1;
            animation: pulseAnim 1.5s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        @keyframes pulseAnim {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        h2 { margin-bottom: 10px; font-weight: 700; color: #1f2937; font-size: 20px; }
        .status-text { font-size: 15px; color: #6b7280; font-weight: 500; height: 24px; transition: 0.3s; }

        /* Success State Override Classes */
        .success-icon { background: #dcfce7 !important; color: #16a34a !important; transform: scale(1.1); }
        .success-text { color: #16a34a !important; font-weight: 600; }
    </style>
</head>
<body>

<div class="processing-card">
    <div class="pulse-container">
        <div class="pulse-ring" id="pulseRing"></div>
        <div class="icon-circle" id="mainIcon">
            <i class="fa-solid fa-arrows-rotate fa-spin"></i>
        </div>
    </div>
    
    <h2>Do not close this window</h2>
    <div class="status-text" id="statusText">Establishing secure connection...</div>
</div>

<script>
    const statusText = document.getElementById("statusText");
    const mainIcon = document.getElementById("mainIcon");
    const pulseRing = document.getElementById("pulseRing");

    setTimeout(() => {
        statusText.innerText = "Verifying payment details...";
    }, 1500);

    setTimeout(() => {
        // Change to success state
        statusText.innerText = "Payment Approved!";
        statusText.classList.add("success-text");
        
        mainIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
        mainIcon.classList.add("success-icon");
        pulseRing.style.display = "none";
    }, 3000);

    setTimeout(() => {
        // Redirect
        window.location.href = "{% url 'adoption_payment_success' %}";
    }, 4500);
</script>

</body>
</html>
