<!DOCTYPE html>
<html>
<head>
    <title>Add Symptoms</title>
</head>

<body>

<h2>Add Symptoms for {{ animal.name }}</h2>

<form method="post">
    {% csrf_token %}

    <label>Reported Symptoms</label><br>
    <textarea name="reported_symptoms"
              rows="5"
              style="width:400px;"></textarea><br><br>

    <button type="submit">Save & Assign Treatment</button>

</form>

</body>
</html>
