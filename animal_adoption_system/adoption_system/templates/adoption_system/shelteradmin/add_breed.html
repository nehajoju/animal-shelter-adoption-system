{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Add Breed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>

/* ================= ROOT VARIABLES ================= */
:root {
    --primary: #a11a3c;
    --primary-dark: #7f102f;
    --secondary: #1f2937;
    --bg-main: #f4f6fa;
    --bg-card: #ffffff;
    --text-main: #374151;
    --text-muted: #6b7280;
    --border-soft: #e5e7eb;
}

/* ================= RESET ================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

/* ================= BODY ================= */
body {
    background: var(--bg-main);
    color: var(--text-main);
    min-height: 100vh;
}

/* ================= PAW BACKGROUND ================= */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("/static/images/paw-print.png");
    background-repeat: repeat;
    background-size: 150px;
    opacity: 0.04;
    z-index: -1;
}

/* ================= TOP BAR ================= */
.top-bar {
    background: var(--secondary);
    color: white;
    padding: 12px;
    text-align: center;
    font-weight: 600;
    letter-spacing: 0.5px;
}

/* ================= PAGE WRAPPER ================= */
.admin-page {
    max-width: 600px;
    margin: 70px auto;
    padding: 0 20px;
    animation: fadeIn 0.5s ease;
}

/* ================= FORM CARD ================= */
.form-card {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: 0 20px 45px rgba(0,0,0,0.08);
    transition: all 0.3s ease;
}

.form-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 25px 55px rgba(0,0,0,0.12);
}

/* ================= LABEL ================= */
.form-card label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    margin-top: 20px;
    color: var(--secondary);
}

/* ================= INPUTS & SELECT ================= */
.form-card input[type="text"],
.form-card select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border-soft);
    font-size: 14px;
    background: #f9fafb;
    transition: all 0.25s ease;
}

.form-card input:focus,
.form-card select:focus {
    outline: none;
    border-color: var(--primary);
    background: white;
    box-shadow: 0 0 0 3px rgba(161,26,60,0.15);
}

/* ================= CHECKBOX ================= */
.form-card label input[type="checkbox"] {
    margin-right: 8px;
    transform: scale(1.1);
}

/* ================= BUTTON ================= */
.btn-primary {
    margin-top: 35px;
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    font-size: 15px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(161,26,60,0.35);
}

/* ================= ANIMATION ================= */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ================= RESPONSIVE ================= */
@media (max-width: 480px) {
    .form-card {
        padding: 25px;
    }

    .admin-page {
        margin-top: 50px;
    }
}
/* ================= NAVBAR ================= */

.navbar{
    background:white;
    padding:18px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--border-soft);
}

.logo{
    font-size:20px;
    font-weight:800;
    color:var(--primary);
}

.nav-right{
    display:flex;
    align-items:center;
    gap:22px;
}

/* NAV LINKS */

.nav-link{
    color:var(--secondary);
    font-weight:600;
    font-size:14px;
    transition:0.25s;
}

.nav-link:hover{
    color:var(--primary);
}

/* NOTIFICATION */

.notification{
    position:relative;
    font-size:18px;
    cursor:pointer;
    color:var(--secondary);
}

.notification:hover{
    color:var(--primary);
}

/* NOTIFICATION BADGE */

.badge{
    position:absolute;
    top:-6px;
    right:-8px;
    background:#ef4444;
    color:white;
    font-size:10px;
    font-weight:700;
    padding:3px 6px;
    border-radius:50px;
}

/* LOGOUT BUTTON */

.logout-btn{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    padding:8px 16px;
    border-radius:10px;
    color:white;
    font-weight:600;
    font-size:13px;
    transition:0.25s;
}

.logout-btn:hover{
    opacity:0.9;
}

    </style>
</head>
<body>
<!-- ================= TOP BAR ================= -->
<div class="top-bar">
    <i class="fa-solid fa-paw"></i> Shelter Admin Panel
</div>

<!-- ================= NAVBAR ================= -->
<header class="navbar">

    <div class="logo">
        🐾 Animal Shelter
    </div>

    <div class="nav-right">

        <!-- Dashboard -->
        <a href="{% url 'admin_dashboard' %}" class="nav-link">
            <i class="fa-solid fa-chart-line"></i> Dashboard
        </a>

        <!-- Back to Animals -->
        <a href="{% url 'animal_management' %}" class="nav-link">
            <i class="fa-solid fa-dog"></i> Back to Animals
        </a>

        <!-- Notification -->
        <div class="notification">
            <i class="fa-solid fa-bell"></i>
            <span class="badge">{{ notification_count|default:"0" }}</span>
        </div>

        <!-- Logout -->
        <a href="{% url 'panel_logout' %}" class="logout-btn">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </a>

    </div>

</header>
<div class="top-bar">🐶 Add Breed</div>

<div class="admin-page">
    <form method="POST" class="form-card">
        {% csrf_token %}

        <label>Pet Type</label>
        {{ form.pet_type }}

        <label>Breed Name</label>
        {{ form.name }}

        <label>
            {{ form.is_active }} Active
        </label>

        <button class="btn btn-primary">Save Breed</button>
    </form>
</div>

</body>
</html>
