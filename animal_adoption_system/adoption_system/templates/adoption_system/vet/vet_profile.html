
<!DOCTYPE html>
<html>
<head>
    <title>Vet Profile</title>

    <style>
        body {
            font-family: Arial;
            background:#f4f6f9;
        }

        .card {
            width:450px;
            margin:40px auto;
            background:white;
            padding:20px;
            border-radius:8px;
        }

        input {
            width:100%;
            padding:8px;
            margin:6px 0;
        }

        button {
            padding:8px 15px;
            border:none;
            border-radius:4px;
            cursor:pointer;
        }

        .edit-btn {
            background:#3498db;
            color:white;
        }

        .save-btn {
            background:#27ae60;
            color:white;
            width:100%;
            margin-top:10px;
        }
    </style>

    <script>
        function enableEdit() {
            document.getElementById("phone").disabled = false;
            document.getElementById("saveBtn").style.display = "block";
        }
    </script>
</head>

<body>

<div class="card">

    <h2>Vet Profile</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Name</label>
        <input type="text" value="{{ vet.name }}" disabled>

        <label>Email</label>
        <input type="text" value="{{ vet.user.email }}" disabled>

        <label>Qualification</label>
        <input type="text" value="{{ vet.qualification }}" disabled>

        <label>Experience</label>
        <input type="text" value="{{ vet.experience_years }} years" disabled>

        <label>Phone</label>
        <input type="text" id="phone" name="phone"
               value="{{ vet.phone }}" disabled>

        <button type="button" class="edit-btn"
                onclick="enableEdit()">Edit</button>

        <button type="submit" id="saveBtn"
                class="save-btn"
                style="display:none;">
            Save Changes
        </button>

    </form>

</div>

</body>
</html>
