<!DOCTYPE html>
<html>

<head>
    <title>Add Vaccine</title>

    <style>
       :root {
    --primary: #a11a3c;
    --primary-dark: #7f102d;
    --primary-soft: #f7e9ee;
    --secondary: #1f2937;
    --bg-main: #f4f6fa;
    --card-bg: #ffffff;
    --text-main: #2b2b2b;
    --text-light: #7a7a7a;
    --border-soft: #e5e7eb;
}

/* ================= GLOBAL ================= */

body {
    margin: 0;
    font-family: "Poppins", "Inter", Arial, sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
}

a {
    text-decoration: none;
}

/* ================= NAVBAR ================= */

.navbar {
    background: white;
    padding: 18px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-soft);
}

.logo {
    font-size: 18px;
    font-weight: 800;
    color: var(--primary);
}

/* NAV RIGHT */

.nav-right {
    display: flex;
    align-items: center;
    gap: 25px;
}

/* NAV LINKS */

.nav-link {
    color: var(--secondary);
    font-weight: 600;
    font-size: 14px;
}

.nav-link:hover {
    color: var(--primary);
}

/* ================= NOTIFICATION ================= */

.notification {
    position: relative;
    font-size: 18px;
    cursor: pointer;
    color: var(--secondary);
}

.notification:hover {
    color: var(--primary);
}

.badge {
    position: absolute;
    top: -6px;
    right: -8px;
    background: #ef4444;
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 6px;
    border-radius: 50px;
}

/* ================= LOGOUT ================= */

.logout-btn {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    padding: 8px 16px;
    border-radius: 8px;
    color: white;
    font-weight: 600;
    font-size: 13px;
}

.logout-btn:hover {
    opacity: 0.9;
}

/* ================= PAGE TITLE ================= */

h2 {
    text-align: center;
    margin-top: 50px;
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
}

/* ================= FORM CARD ================= */

form {
    width: 420px;
    margin: 30px auto;
    background: var(--card-bg);
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    border: 1px solid var(--border-soft);
}

/* LABEL */

label {
    font-size: 13px;
    font-weight: 600;
    color: #444;
}

/* INPUT */

input {
    width: 100%;
    padding: 11px;
    margin-top: 6px;
    margin-bottom: 18px;
    border-radius: 8px;
    border: 1px solid var(--border-soft);
    font-size: 13px;
    transition: all 0.2s ease;
}

/* INPUT FOCUS */

input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(161, 26, 60, 0.1);
    outline: none;
}

/* BUTTON */

button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s ease;
}

button:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

.popup{
    position: fixed;
    top: 20px;
    right: 20px;
    background: #16a34a;
    color: white;
    padding: 14px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    animation: slideIn 0.4s ease;
}

/* animation */
@keyframes slideIn{
    from{
        opacity:0;
        transform: translateX(30px);
    }
    to{
        opacity:1;
        transform: translateX(0);
    }
}
    </style>
</head>

<body>
    <header class="navbar">

    <div class="logo">
        🩺 Vet Panel
    </div>

    <div class="nav-right">

        <!-- Back Button -->
        <a href="javascript:history.back()" class="nav-link">
            <i class="fa-solid fa-arrow-left"></i> Back
        </a>

        <!-- Dashboard -->
        <a href="{% url 'vet_dashboard' %}" class="nav-link">
            <i class="fa-solid fa-chart-line"></i> Dashboard
        </a>

        <!-- Notifications -->
        <div class="notification">
            <i class="fa-solid fa-bell"></i>
            <span class="badge">{{ notification_count|default:"0" }}</span>
        </div>

        <!-- Logout -->
        <a href="{% url 'panel_logout' %}" class="logout-btn">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </a>

    </div>

</header>

    <h2>Add Vaccine Name</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Vaccine Name</label>
        <input type="text" name="vaccine_name" placeholder="Example: Rabies" required>

        <button type="submit">Save Vaccine</button>

    </form>
    {% if messages %}
<div id="successPopup" class="popup">
    {% for message in messages %}
        ✅ {{ message }}
    {% endfor %}
</div>
{% endif %}
<script>
setTimeout(function(){
    const popup = document.getElementById("successPopup");
    if(popup){
        popup.style.display = "none";
    }
},3000);
</script>
</body>

</html>
