{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shelter Panel Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primary: #be123c;
            --primary-dark: #9f1239;
            --bg-light: #fff1f2;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-soft: #e5e7eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        body {
            background: var(--bg-light);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-box {
            background: var(--card-bg);
            padding: 35px 30px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #ffe4e6;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-soft);
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 6px rgba(190, 18, 60, 0.2);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 12px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-muted);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: var(--primary-dark);
        }

        .error-message {
            background: #ffe4e6;
            color: #be123c;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }

        .validation-error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 4px;
        }

        .success-message {
            color: #16a34a;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
        }

    </style>
</head>

<body>

<div class="login-container">
    <div class="login-box">

        <h2>🐾 Shelter Panel Login</h2>
        <p class="subtitle">Admin • Vet • Shelter Staff</p>

        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST" id="loginForm" novalidate>
            {% csrf_token %}

            <div class="input-group">
                <input type="text" name="username" id="username" placeholder="Username">
                <div class="validation-error" id="usernameError"></div>
            </div>

            <div class="input-group">
                <input type="password" name="password" id="password" placeholder="Password">
                <span class="toggle-password" onclick="togglePassword()">Show</span>
                <div class="validation-error" id="passwordError"></div>
            </div>

            <button type="submit">Login</button>

            <div class="success-message" id="successMessage"></div>
        </form>

    </div>
</div>

<script>
    const form = document.getElementById("loginForm");
    const username = document.getElementById("username");
    const password = document.getElementById("password");

    const usernameError = document.getElementById("usernameError");
    const passwordError = document.getElementById("passwordError");
    const successMessage = document.getElementById("successMessage");

    form.addEventListener("submit", function(event) {

        let valid = true;

        usernameError.textContent = "";
        passwordError.textContent = "";
        successMessage.textContent = "";

        if (username.value.trim() === "") {
            usernameError.textContent = "Username is required.";
            valid = false;
        }

        if (password.value.trim() === "") {
            passwordError.textContent = "Password is required.";
            valid = false;
        }

        if (!valid) {
            event.preventDefault();
            return;
        }

        successMessage.textContent = "Logging in...";
    });

    function togglePassword() {
        if (password.type === "password") {
            password.type = "text";
        } else {
            password.type = "password";
        }
    }
</script>

</body>
</html>
